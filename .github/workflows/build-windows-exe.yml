name: Build Byabodhan OMR Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project files
        shell: bash
        run: |
          if [ -f "main.py" ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          elif [ -f "ByabodhanOMR_WindowsApp/main.py" ]; then
            echo "PROJ_DIR=ByabodhanOMR_WindowsApp" >> $GITHUB_ENV
          else
            echo "main.py not found!" && ls -la && exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and PyInstaller
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows EXE
        working-directory: ${{ env.PROJ_DIR }}
        run: pyinstaller --noconfirm --onefile --windowed --name "ByabodhanOMR_Windows" --icon "assets/logo.ico" --add-data "assets/logo.jpeg;assets" --add-data "assets/logo.ico;assets" main.py

      - name: Upload Downloadable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Byabodhan-OMR-Windows-EXE
          path: ${{ env.PROJ_DIR }}/dist/ByabodhanOMR_Windows.exe
